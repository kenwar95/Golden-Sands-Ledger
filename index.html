<body>
<div class="scene">
  <section class="header-brand"><div class="brand-seal">GS</div><div><span class="k">Merchant Ledger</span><h1>Golden Sands Trading Company</h1><p>Honest trade across Skyrim</p></div></section>
  <section class="biz-box"><label>Current Business</label><select id="businessSelect"></select><small id="businessLocation"></small></section>
  <section class="coffer-box"><div><span>Company Coffers</span><strong id="companyCoffers"></strong></div><div><span>Business Coffers</span><strong id="businessCoffers"></strong></div></section>
  <section class="owner-box"><div class="crest">◆</div><strong>Ko'vash</strong><small>Company Owner</small></section>
  <nav id="nav" class="nav"></nav>
  <section class="book"><article id="leftPage" class="page left"></article><article id="rightPage" class="page right"></article></section>
  <aside id="receipt" class="receipt"><div class="brand">Golden Sands</div><h3>Receipt</h3><div class="receipt-empty">The next sale will be written here.</div></aside>
</div>
<div id="modalRoot"></div>
<script>
const seed={
 activeBusinessId:'caravan',company:{name:'Golden Sands Trading Company',owner:"Ko'vash",caravanCut:20},
 businesses:[
  {id:'caravan',name:'Golden Sands Caravan',type:'Caravan',hold:'The Pale',location:'Dawnstar market camp',description:'Primary travelling caravan and trade hub.',status:'Active',coffers:12450},
  {id:'farm',name:'Golden Sands Farm',type:'Farm',hold:'The Pale',location:'Outside Dawnstar',description:'Company farm supplying produce and ingredients.',status:'Active',coffers:3820},
  {id:'inn',name:'Future Golden Sands Inn',type:'Inn',hold:'Unassigned',location:'Unassigned',description:'Future hospitality business.',status:'Inactive',coffers:0}
 ],
 employees:[
  {id:1,name:"Ko'vash",email:'owner@example.com',role:'Company Owner',earnings:0,assignments:{caravan:{enabled:true,permissions:['all']},farm:{enabled:true,permissions:['all']},inn:{enabled:true,permissions:['all']}}},
  {id:2,name:"Ra'zirr",email:'razirr@example.com',role:'Merchant',earnings:3250,assignments:{caravan:{enabled:true,permissions:['register','inventory_view','orders','notebook','tasks']},farm:{enabled:false,permissions:[]},inn:{enabled:false,permissions:[]}}},
  {id:3,name:"M'aiqra",email:'maiqra@example.com',role:'Caravan Hand',earnings:1480,assignments:{caravan:{enabled:true,permissions:['inventory_view','transfers','notebook','tasks']},farm:{enabled:true,permissions:['inventory_view','inventory_edit','transfers','tasks']},inn:{enabled:false,permissions:[]}}}
 ],
 inventory:[
  {id:1,businessId:'caravan',name:'Moon Monk Robes',category:'Apparel',condition:'Exquisite',qty:4,price:1650,batches:[{batchId:'b1',qty:4,contributorId:2,source:'Stock Intake'}]},
  {id:2,businessId:'caravan',name:'Khajiit Merchant Robes',category:'Apparel',condition:'Fine',qty:7,price:900,batches:[{batchId:'b2',qty:5,contributorId:1,source:'Stock Intake'},{batchId:'b3',qty:2,contributorId:3,source:'Transfer from Farm'}]},
  {id:3,businessId:'caravan',name:'Moon Sugar',category:'Ingredient',condition:'Standard',qty:23,price:95,batches:[{batchId:'b4',qty:15,contributorId:2,source:'Stock Intake'},{batchId:'b5',qty:8,contributorId:3,source:'Stock Intake'}]},
  {id:4,businessId:'farm',name:'Potato',category:'Produce',condition:'Fresh',qty:48,price:12,batches:[{batchId:'b6',qty:48,contributorId:3,source:'Harvest / Intake'}]}
 ],
 notes:[{id:1,author:"Ra'zirr",date:'16th of Last Seed',businessId:'caravan',text:'A hunter near Whiterun claims he will have ten wolf pelts tomorrow.',pinned:true}],
 history:[],transfers:[]
};
let state=JSON.parse(localStorage.getItem("gsl-hybrid-v10")||"null")||structuredClone(seed),currentView="company",cart=[];
const $=s=>document.querySelector(s);
function save(){localStorage.setItem("gsl-hybrid-v10",JSON.stringify(state));sync()}
function money(n){return Number(n||0).toLocaleString()+" septims"}
function activeBusiness(){return state.businesses.find(b=>b.id===state.activeBusinessId)||state.businesses[0]}
function inv(){return state.inventory.filter(i=>i.businessId===state.activeBusinessId)}
function empName(id){return state.employees.find(e=>e.id===id)?.name||"Unknown"}
function eligibleEmployees(bid=state.activeBusinessId){return state.employees.filter(e=>e.assignments?.[bid]?.enabled)}
function bizName(id){return state.businesses.find(b=>b.id===id)?.name||id}
function sync(){
 const total=state.businesses.reduce((a,b)=>a+(Number(b.coffers)||0),0);
 $("#companyCoffers").textContent=money(total);$("#businessCoffers").textContent=money(activeBusiness().coffers);
 $("#businessLocation").textContent=activeBusiness().hold+" · "+activeBusiness().location;
}
function buildBiz(){
 const s=$("#businessSelect");s.innerHTML=state.businesses.filter(b=>b.status==="Active").map(b=>`<option value="${b.id}" ${b.id===state.activeBusinessId?"selected":""}>${b.name}</option>`).join("");
 s.onchange=()=>{state.activeBusinessId=s.value;save();render()};
}
const navItems=[["company","Company Overview"],["businesses","Businesses"],["dashboard","Dashboard"],["register","Register"],["inventory","Inventory"],["transfers","Transfers"],["notebook","Notebook"],["employees","Employees"],["suppliers","Suppliers"],["orders","Orders"],["coffers","Coffers"],["history","Sales History"],["permissions","Permissions"]];
function buildNav(){$("#nav").innerHTML=navItems.map(([v,l])=>`<button class="${currentView===v?"active":""}" onclick="go('${v}')">${l}</button>`).join("")}
function go(v){currentView=v;buildNav();render()} window.go=go;
function heading(k,t){return `<span class="kicker">${k}</span><h2>${t}</h2><div class="rule"></div>`}
function row(a,b){return `<div class="account-row"><span>${a}</span><strong>${b}</strong></div>`}
function render(){buildNav();sync();(views[currentView]||views.company)()}
const views={};
views.company=()=>{
 const total=state.businesses.reduce((a,b)=>a+b.coffers,0);
 $("#leftPage").innerHTML=heading("Golden Sands Trading Company","Company Overview")+`<div class="section-title">Company Summary</div>${row("Company Coffers",money(total))}${row("Active Businesses",state.businesses.filter(b=>b.status==="Active").length)}${row("Employees",state.employees.length)}${row("Inventory Items (Stock)",state.inventory.reduce((a,b)=>a+b.qty,0))}<div class="section-title">Our Businesses</div>`+state.businesses.map(b=>`<div class="biz-entry"><button onclick="switchBusiness('${b.id}')"><strong>${b.name}</strong><small>${b.hold} · ${b.location}</small></button><div class="r">${money(b.coffers)}<br>${b.status}</div></div>`).join("");
 $("#rightPage").innerHTML=heading("Quick Overview","Company Records")+`${row("Company Coffers",money(total))}${row("Business Coffers",money(activeBusiness().coffers))}${row("Employees",state.employees.length)}${row("Inventory Items",state.inventory.reduce((a,b)=>a+b.qty,0))}${row("Active Businesses",state.businesses.filter(b=>b.status==="Active").length)}${row("Open Orders",state.orders?.filter(o=>o.status!=="Completed").length||0)}${row("Suppliers",state.suppliers?.length||0)}`;
};
window.switchBusiness=id=>{state.activeBusinessId=id;save();buildBiz();go("dashboard")};
views.businesses=()=>{$("#leftPage").innerHTML=heading("Golden Sands Trading Company","Businesses")+`<div class="actions"><button class="ink" onclick="addBusiness()">Add Business</button></div>`+state.businesses.map(b=>`<div class="biz-entry"><button onclick="switchBusiness('${b.id}')"><strong>${b.name}</strong><small>${b.type} · ${b.hold} · ${b.location}</small></button><div class="r"><button class="ink" onclick="editBusiness('${b.id}')">Edit</button></div></div>`).join("");$("#rightPage").innerHTML=heading("Company Structure","Business Status")+state.businesses.map(b=>row(b.name,b.status)).join("")};
views.dashboard=()=>{const b=activeBusiness();$("#leftPage").innerHTML=heading(b.name,"Business Ledger")+row("Business Coffers",money(b.coffers))+row("Stock Units",inv().reduce((a,x)=>a+x.qty,0))+row("Assigned Employees",eligibleEmployees().length)+`<div class="section-title">Quick Entries</div><div class="actions"><button class="ink" onclick="go('register')">Open Register</button><button class="ink" onclick="go('inventory')">Inventory</button><button class="ink" onclick="go('transfers')">Transfer Stock</button></div>`;$("#rightPage").innerHTML=heading("Current Stock","Inventory")+`<table><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Price</th></tr></thead><tbody>${inv().slice(0,12).map(i=>`<tr><td>${i.name}</td><td class="num">${i.qty}</td><td class="num">${i.price}</td></tr>`).join("")}</tbody></table>`};
views.inventory=()=>{$("#leftPage").innerHTML=heading(activeBusiness().name,"Inventory Ledger")+`<div class="actions"><button class="ink" onclick="stockIntake()">Record Stock</button><button class="ink" onclick="addItem()">New Item</button></div><table><thead><tr><th>Item</th><th>Condition</th><th class="num">Qty</th><th class="num">Price</th></tr></thead><tbody>${inv().map(i=>`<tr><td>${i.name}</td><td>${i.condition}</td><td class="num">${i.qty}</td><td class="num">${i.price}</td></tr>`).join("")}</tbody></table>`;$("#rightPage").innerHTML=heading("Stock Provenance","Contributors")+inv().map(i=>`<div class="biz-entry"><div><strong>${i.name}</strong><small>${i.batches.map(b=>`${b.qty} by ${empName(b.contributorId)}`).join(" · ")||"No batches"}</small></div></div>`).join("")};
views.register=()=>{$("#leftPage").innerHTML=heading(activeBusiness().name,"Register")+`<div class="item-grid">${inv().filter(i=>i.qty>0).map(i=>`<button class="item" onclick="addCart(${i.id})"><strong>${i.name}</strong><small>${i.qty} in stock · ${money(i.price)}</small></button>`).join("")}</div>`;drawRight()};
function drawRight(){
 const es=eligibleEmployees();$("#rightPage").innerHTML=heading("Current Sale","Transaction")+(cart.length?cart.map(c=>`<div class="cart-row"><span>${c.name} × ${c.qty}</span><span><button class="qty" onclick="cartQty(${c.id},-1)">−</button> <button class="qty" onclick="cartQty(${c.id},1)">+</button></span></div>`).join(""):`<div class="receipt-empty">No items selected.</div>`)+`<div class="form2" style="margin-top:.6vw"><div class="field"><label>Discount %</label><input id="discount" type="number" min="0" max="100" value="0" oninput="drawReceipt()"></div><div class="field"><label>Seller</label><select id="seller" onchange="drawReceipt()">${es.map(e=>`<option value="${e.id}">${e.name}</option>`).join("")}</select></div></div><div class="field"><label>Additional Participants</label>${es.map(e=>`<label class="checkbox-line"><input class="extraPart" type="checkbox" value="${e.id}" onchange="drawReceipt()"> ${e.name}</label>`).join("")}</div><div class="actions"><button class="ink" onclick="completeSale()">Complete Sale</button></div>`;drawReceipt();
}
window.addCart=id=>{const i=state.inventory.find(x=>x.id===id),c=cart.find(x=>x.id===id);if(c){if(c.qty<i.qty)c.qty++}else cart.push({id:i.id,name:i.name,price:i.price,qty:1});drawRight()};
window.cartQty=(id,d)=>{const c=cart.find(x=>x.id===id),i=state.inventory.find(x=>x.id===id);if(!c)return;c.qty=Math.max(0,Math.min(i.qty,c.qty+d));if(c.qty===0)cart=cart.filter(x=>x.id!==id);drawRight()};
function contributors(){const map=new Map();for(const c of cart){const item=state.inventory.find(i=>i.id===c.id);let need=c.qty;for(const b of item.batches){if(need<=0)break;const used=Math.min(need,b.qty);if(used>0){map.set(b.contributorId,(map.get(b.contributorId)||0)+used);need-=used}}}return [...map.entries()].map(([id,units])=>({id,name:empName(id),units}))}
function nums(){const subtotal=cart.reduce((a,b)=>a+b.price*b.qty,0),d=Math.max(0,Math.min(100,Number($("#discount")?.value)||0)),sale=Math.round(subtotal*(1-d/100)),cut=Math.round(sale*(state.company.caravanCut/100));return{sale,cut,pool:sale-cut}}
function drawReceipt(){const r=nums(),cs=contributors(),sellerId=Number($("#seller")?.value||0),extras=[...document.querySelectorAll(".extraPart:checked")].map(x=>Number(x.value)),parts=[...new Set([sellerId,...cs.map(c=>c.id),...extras].filter(Boolean))],share=parts.length?Math.floor(r.pool/parts.length):0;$("#receipt").innerHTML=`<div class="brand">Golden Sands</div><h3>Receipt</h3>${cart.map(c=>`<div class="receipt-line"><span>${c.name} × ${c.qty}</span><span>${c.price*c.qty}</span></div>`).join("")}<div class="receipt-line"><span>Sale</span><strong>${r.sale}</strong></div><div class="receipt-line"><span>Company Cut</span><strong>${r.cut}</strong></div><div class="receipt-section"><strong>Seller</strong><div class="role-line"><span>${empName(sellerId)}</span><span>Seller</span></div></div><div class="receipt-section"><strong>Contributors</strong>${cs.map(c=>`<div class="role-line"><span>${c.name}</span><span>${c.units} units</span></div>`).join("")||'<div class="role-line"><span>None</span><span>—</span></div>'}</div><div class="receipt-section"><strong>Split</strong>${parts.map(id=>`<div class="role-line"><span>${empName(id)}</span><span>${share}</span></div>`).join("")}</div><div class="receipt-total"><span>Total</span><strong>${r.sale}</strong></div>`}
function consume(item,qty){let need=qty,used=[];for(const b of item.batches){if(need<=0)break;const take=Math.min(need,b.qty);if(take){used.push({contributorId:b.contributorId,qty:take,source:b.source});b.qty-=take;need-=take}}item.batches=item.batches.filter(b=>b.qty>0);item.qty-=qty;return used}
window.completeSale=()=>{if(!cart.length)return alert("Add an item.");const r=nums(),sellerId=Number($("#seller").value),extras=[...document.querySelectorAll(".extraPart:checked")].map(x=>Number(x.value)),cm=new Map();cart.forEach(c=>{const item=state.inventory.find(i=>i.id===c.id);consume(item,c.qty).forEach(u=>cm.set(u.contributorId,(cm.get(u.contributorId)||0)+u.qty))});const cids=[...cm.keys()],parts=[...new Set([sellerId,...cids,...extras])],share=parts.length?Math.floor(r.pool/parts.length):0;parts.forEach(id=>{const e=state.employees.find(x=>x.id===id);if(e)e.earnings+=share});activeBusiness().coffers+=r.cut;state.history.unshift({id:Date.now(),businessId:state.activeBusinessId,type:"Sale",date:new Date().toLocaleString(),who:empName(sellerId),detail:cart.map(c=>`${c.name} × ${c.qty}`).join(", "),amount:r.sale,companyCut:r.cut,share,participants:parts.map(id=>({id,name:empName(id),roles:[id===sellerId?"Seller":null,cids.includes(id)?"Stock Contributor":null,extras.includes(id)?"Additional":null].filter(Boolean)}))});save();cart=[];render();alert("Sale recorded.")};
views.transfers=()=>{$("#leftPage").innerHTML=heading(activeBusiness().name,"Transfers")+`<div class="actions"><button class="ink" onclick="newTransfer()">New Transfer</button></div><table><thead><tr><th>Item</th><th>Qty</th><th>From</th><th>To</th></tr></thead><tbody>${state.transfers.map(t=>`<tr><td>${t.item}</td><td>${t.qty}</td><td>${t.from}</td><td>${t.to}</td></tr>`).join("")}</tbody></table>`;$("#rightPage").innerHTML=heading("Contributor Trail","Trace")+state.transfers.map(t=>`<div class="biz-entry"><div><strong>${t.item} × ${t.qty}</strong><small>By ${t.by}</small></div><div class="r">${(t.trace||[]).map(x=>`${empName(x.contributorId)} ${x.qty}`).join("<br>")}</div></div>`).join("")};
views.notebook=()=>{$("#leftPage").innerHTML=heading(activeBusiness().name,"Caravan Notebook")+`<div class="actions"><button class="ink" onclick="newNote()">Write Note</button></div>`+state.notes.filter(n=>n.businessId===state.activeBusinessId).map(n=>`<div class="biz-entry"><div><strong>${n.author}</strong><small>${n.date}</small><p style="font-size:.58vw">${n.text}</p></div></div>`).join("");$("#rightPage").innerHTML=heading("In Character","Notices")+`<div class="receipt-empty">Notes here are written in-character for the caravan.</div>`};
views.employees=()=>{$("#leftPage").innerHTML=heading("Golden Sands Trading Company","Employee Roster")+`<div class="actions"><button class="ink" onclick="addEmployee()">Add Employee</button></div>`+state.employees.map(e=>`<div class="biz-entry"><div><strong>${e.name}</strong><small>${e.role} · ${e.email}</small></div><div class="r"><button class="ink" onclick="editEmployee(${e.id})">Access</button></div></div>`).join("");$("#rightPage").innerHTML=heading("Business Access","Assignments")+state.employees.map(e=>`<div class="biz-entry"><div><strong>${e.name}</strong><small>${state.businesses.filter(b=>e.assignments?.[b.id]?.enabled).map(b=>b.name).join(", ")||"No access"}</small></div></div>`).join("")};
views.suppliers=()=>{$("#leftPage").innerHTML=heading("Trade Contacts","Suppliers")+(state.suppliers?.length?state.suppliers.map(s=>`<div class="biz-entry"><div><strong>${s.name}</strong><small>${s.hold} · ${s.location}</small></div></div>`).join(""):`<div class="receipt-empty">No suppliers recorded in this build yet.</div>`);$("#rightPage").innerHTML=heading("Supplier Goods","Price Book")+`<div class="receipt-empty">Supplier management will be fully restored in the backend-integrated build.</div>`};
views.orders=()=>{$("#leftPage").innerHTML=heading(activeBusiness().name,"Orders")+`<div class="receipt-empty">Order management remains part of the project structure and will be restored in the backend-integrated build.</div>`;$("#rightPage").innerHTML=heading("Deliveries","Order Receipts")+`<div class="receipt-empty">Completed orders will use the same participant split receipt system.</div>`};
views.coffers=()=>{$("#leftPage").innerHTML=heading(activeBusiness().name,"Coffers Ledger")+row("Business Balance",money(activeBusiness().coffers))+row("Company Total",money(state.businesses.reduce((a,b)=>a+b.coffers,0)))+row("Company Cut",state.company.caravanCut+"%");$("#rightPage").innerHTML=heading("Company Accounts","Business Coffers")+state.businesses.map(b=>row(b.name,money(b.coffers))).join("")};
views.history=()=>{const hs=state.history.filter(h=>h.businessId===state.activeBusinessId);$("#leftPage").innerHTML=heading(activeBusiness().name,"Sales History")+`<table><thead><tr><th>Date</th><th>Seller</th><th>Goods</th><th class="num">Sale</th></tr></thead><tbody>${hs.map(h=>`<tr><td>${h.date}</td><td>${h.who}</td><td>${h.detail}</td><td class="num">${h.amount}</td></tr>`).join("")}</tbody></table>`;$("#rightPage").innerHTML=heading("Participants","Sale Shares")+hs.map(h=>`<div class="biz-entry"><div><strong>${h.detail}</strong><small>${h.participants?.map(p=>p.name+" ("+p.roles.join("/")+")").join(", ")||"—"}</small></div></div>`).join("")};
views.permissions=()=>{$("#leftPage").innerHTML=heading("Administration","Permissions")+`<div class="receipt-empty">Employee access is managed from the Employees page.</div>`;$("#rightPage").innerHTML=heading("Google Login","Future Backend")+`<div class="receipt-empty">Google authentication becomes active when Cloudflare is connected.</div>`};
function modal(title,body,onSave){$("#modalRoot").innerHTML=`<div class="modal-bg"><div class="modal"><h3>${title}</h3>${body}<div class="actions"><button class="ink" onclick="closeModal()">Cancel</button><button id="modalSave" class="ink">Save</button></div></div></div>`;$("#modalSave").onclick=onSave}
window.closeModal=()=>$("#modalRoot").innerHTML="";
window.addBusiness=()=>modal("Add Business",`<div class="field"><label>Name</label><input id="bName"></div><div class="form2"><div class="field"><label>Type</label><input id="bType" value="Shop"></div><div class="field"><label>Hold</label><input id="bHold"></div></div><div class="field"><label>Location</label><input id="bLoc"></div>`,()=>{const n=$("#bName").value.trim();if(!n)return;const id="biz"+Date.now();state.businesses.push({id,name:n,type:$("#bType").value||"Shop",hold:$("#bHold").value||"Unassigned",location:$("#bLoc").value||"Unassigned",description:"",status:"Active",coffers:0});state.employees.forEach(e=>e.assignments[id]={enabled:false,permissions:[]});save();closeModal();buildBiz();render()});
window.editBusiness=id=>{const b=state.businesses.find(x=>x.id===id);modal("Edit Business",`<div class="field"><label>Name</label><input id="bName" value="${b.name}"></div><div class="form2"><div class="field"><label>Type</label><input id="bType" value="${b.type}"></div><div class="field"><label>Hold</label><input id="bHold" value="${b.hold}"></div></div><div class="field"><label>Location</label><input id="bLoc" value="${b.location}"></div>`,()=>{b.name=$("#bName").value;b.type=$("#bType").value;b.hold=$("#bHold").value;b.location=$("#bLoc").value;save();closeModal();buildBiz();render()})};
window.addItem=()=>modal("New Item",`<div class="field"><label>Name</label><input id="iName"></div><div class="form2"><div class="field"><label>Category</label><input id="iCat"></div><div class="field"><label>Condition</label><input id="iCond" value="Standard"></div></div><div class="field"><label>Price</label><input id="iPrice" type="number"></div>`,()=>{if(!$("#iName").value.trim())return;state.inventory.push({id:Date.now(),businessId:state.activeBusinessId,name:$("#iName").value.trim(),category:$("#iCat").value||"Misc",condition:$("#iCond").value||"Standard",qty:0,price:Number($("#iPrice").value)||0,batches:[]});save();closeModal();render()});
window.stockIntake=()=>modal("Stock Intake",`<div class="field"><label>Item</label><select id="siItem">${inv().map(i=>`<option value="${i.id}">${i.name}</option>`).join("")}</select></div><div class="form2"><div class="field"><label>Quantity</label><input id="siQty" type="number" value="1"></div><div class="field"><label>Employee</label><select id="siEmp">${eligibleEmployees().map(e=>`<option value="${e.id}">${e.name}</option>`).join("")}</select></div></div>`,()=>{const i=state.inventory.find(x=>x.id===Number($("#siItem").value)),q=Math.max(1,Number($("#siQty").value)||1),eid=Number($("#siEmp").value);i.qty+=q;i.batches.push({batchId:"b"+Date.now(),qty:q,contributorId:eid,source:"Stock Intake"});save();closeModal();render()});
window.addEmployee=()=>modal("Add Employee",`<div class="field"><label>Name</label><input id="eName"></div><div class="field"><label>Google Email</label><input id="eEmail"></div><div class="field"><label>Role</label><input id="eRole" value="Merchant"></div>`,()=>{if(!$("#eName").value.trim())return;const assignments={};state.businesses.forEach(b=>assignments[b.id]={enabled:false,permissions:[]});state.employees.push({id:Date.now(),name:$("#eName").value.trim(),email:$("#eEmail").value.trim(),role:$("#eRole").value||"Merchant",earnings:0,assignments});save();closeModal();render()});
window.editEmployee=id=>{const e=state.employees.find(x=>x.id===id);modal("Business Access",state.businesses.map(b=>`<label style="display:block;margin:8px 0;font-size:13px"><input class="bizA" data-biz="${b.id}" type="checkbox" ${e.assignments?.[b.id]?.enabled?"checked":""}> ${b.name}</label>`).join(""),()=>{state.businesses.forEach(b=>{e.assignments[b.id]=e.assignments[b.id]||{permissions:[]};e.assignments[b.id].enabled=document.querySelector(`.bizA[data-biz="${b.id}"]`).checked});save();closeModal();render()})};
window.newTransfer=()=>modal("Transfer Stock",`<div class="field"><label>Item</label><select id="trItem">${inv().map(i=>`<option value="${i.id}">${i.name} (${i.qty})</option>`).join("")}</select></div><div class="form2"><div class="field"><label>Qty</label><input id="trQty" type="number" value="1"></div><div class="field"><label>Destination</label><select id="trDest">${state.businesses.filter(b=>b.id!==state.activeBusinessId&&b.status==="Active").map(b=>`<option value="${b.id}">${b.name}</option>`).join("")}</select></div></div><div class="field"><label>Employee</label><select id="trEmp">${eligibleEmployees().map(e=>`<option value="${e.id}">${e.name}</option>`).join("")}</select></div>`,()=>{const src=state.inventory.find(i=>i.id===Number($("#trItem").value)),qty=Math.max(1,Number($("#trQty").value)||1),dest=$("#trDest").value,eid=Number($("#trEmp").value);if(qty>src.qty)return alert("Not enough stock.");let need=qty,trace=[];for(const b of src.batches){if(need<=0)break;const take=Math.min(need,b.qty);if(take){trace.push({contributorId:b.contributorId,qty:take,source:b.source});b.qty-=take;need-=take}}src.batches=src.batches.filter(b=>b.qty>0);src.qty-=qty;let target=state.inventory.find(i=>i.businessId===dest&&i.name===src.name&&i.condition===src.condition);if(!target){target={...src,id:Date.now(),businessId:dest,qty:0,batches:[]};state.inventory.push(target)}target.qty+=qty;trace.forEach(t=>target.batches.push({batchId:"b"+Date.now()+Math.random(),qty:t.qty,contributorId:t.contributorId,source:"Transfer by "+empName(eid)}));state.transfers.unshift({id:Date.now(),date:new Date().toLocaleString(),item:src.name,qty,from:activeBusiness().name,to:bizName(dest),by:empName(eid),trace});save();closeModal();render()});
window.newNote=()=>modal("Write Note",`<div class="field"><label>Notice</label><textarea id="nText"></textarea></div>`,()=>{if(!$("#nText").value.trim())return;state.notes.unshift({id:Date.now(),author:"Ko'vash",date:new Date().toLocaleString(),businessId:state.activeBusinessId,text:$("#nText").value.trim(),pinned:false});save();closeModal();render()});
buildBiz();buildNav();sync();render();
</script>
</body></html>
