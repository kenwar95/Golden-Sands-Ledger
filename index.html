/* dark veil lets the real controls read over the illustrative labels */
.scene:after {
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.01),rgba(0,0,0,.03));
}
.live-business {
  position:absolute;left:48.7%;top:3.2%;width:18.5%;height:10.8%;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#ead5ab;text-align:center;
}
.live-business label{font-size:.58vw;text-transform:uppercase;letter-spacing:.12em;color:#c8a564}
.live-business select{
  width:88%;background:rgba(28,17,11,.86);color:#f1ddb5;border:0;border-bottom:1px solid #8e6a3e;
  padding:.3vw;text-align:center;font-size:.9vw;outline:none
}
.live-business small{font-size:.55vw;color:#bca180;margin-top:.25vw}
.live-coffers {
  position:absolute;left:67.9%;top:3.2%;width:18.2%;height:10.6%;z-index:5;
  display:grid;grid-template-columns:1fr 1fr;align-items:center;text-align:center;
}
.live-coffers span{display:block;font-size:.52vw;text-transform:uppercase;letter-spacing:.09em;color:#6c5235}
.live-coffers strong{display:block;font-size:1.05vw;margin-top:.25vw}
/* nav sits directly on top of illustrated leather bookmarks */
.nav {
  position:absolute;left:1.3%;top:20.6%;width:13.6%;z-index:10;
  display:flex;flex-direction:column;gap:.7vw
}
.nav button {
  height:4.15vw;max-height:62px;min-height:44px;
  border:0;background:rgba(45,24,15,.14);color:#f1d9aa;text-align:left;
  padding-left:3.2vw;font-size:.82vw;text-transform:uppercase;letter-spacing:.02em;
  text-shadow:0 1px 2px #000;
}
.nav button:hover,.nav button.active{background:rgba(122,58,31,.33);color:#fff2ce}
/* paper masks cover the baked-in text but retain the illustrated book edges underneath */
.book-live {
  position:absolute;left:16.2%;top:17.6%;width:61.8%;height:69.4%;z-index:4;
  display:grid;grid-template-columns:1fr 1fr;gap:2.4%;
}
.page {
  position:relative;padding:3.4% 4.5%;overflow:auto;
  background:
    repeating-linear-gradient(0deg,rgba(88,56,28,.016) 0 1px,transparent 1px 4px),
    rgba(238,214,173,.90);
  box-shadow:inset 0 0 40px rgba(101,62,27,.07);
}
.left-page{clip-path:polygon(1% 1%,99% 0,100% 99%,1% 100%,0 96%,.7% 90%,0 83%,.6% 74%,0 66%,.6% 57%,0 49%,.7% 40%,0 31%,.8% 21%,0 10%)}
.right-page{clip-path:polygon(1% 0,99% 1%,100% 10%,99.3% 21%,100% 31%,99.4% 41%,100% 52%,99.4% 63%,100% 75%,99.4% 86%,100% 97%,99% 100%,0 99%,0 1%)}
.page h2{font-size:1.55vw;font-weight:normal;margin:.15vw 0 .5vw;text-align:center}
.page .kicker{display:block;text-align:center;font-size:.55vw;text-transform:uppercase;letter-spacing:.14em;color:#765638}
.rule{height:1px;background:linear-gradient(90deg,transparent,#7c5a38 15%,#7c5a38 85%,transparent);margin:.7vw auto 1vw}
.account-lines{margin-top:.4vw}
.account-row{display:flex;justify-content:space-between;gap:1.5vw;padding:.58vw .15vw;border-bottom:1px dotted var(--line);font-size:.74vw}
.account-row strong{font-size:.78vw}
.section-title{margin:1.25vw 0 .5vw;text-align:center;font-size:.62vw;text-transform:uppercase;letter-spacing:.12em;color:#724f31}
.business-entry{display:grid;grid-template-columns:1fr auto;gap:1vw;padding:.55vw .1vw;border-bottom:1px solid rgba(75,45,20,.22);font-size:.7vw}
.business-entry button{border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.business-entry strong,.business-entry small{display:block} .business-entry small{color:#725c43;font-size:.57vw;margin-top:.12vw}
.business-entry .right{text-align:right;font-size:.62vw}
.ledger-table{width:100%;border-collapse:collapse;font-size:.65vw}
.ledger-table th{text-align:left;font-size:.52vw;text-transform:uppercase;letter-spacing:.08em;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.45vw .3vw}
.ledger-table td{padding:.48vw .3vw;border-bottom:1px dotted rgba(80,50,25,.28);vertical-align:top}
.ledger-table .num{text-align:right}
.inline-actions{display:flex;justify-content:center;gap:.8vw;flex-wrap:wrap;margin-top:1vw}
.ink-btn{border:0;border-bottom:1px solid #725132;background:none;color:#5f4127;padding:.2vw .1vw;font-size:.62vw}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.55vw;margin-bottom:.55vw}
.field label{display:block;font-size:.48vw;text-transform:uppercase;letter-spacing:.08em;color:#765536;margin-bottom:.18vw}
.field input,.field select,.field textarea{width:100%;border:1px solid rgba(92,61,32,.42);background:rgba(247,230,196,.7);padding:.35vw;font-size:.63vw}
.field textarea{min-height:3.3vw}
.item-list{display:grid;grid-template-columns:1fr 1fr;gap:.45vw}
.item-btn{border:1px solid rgba(86,55,28,.26);background:rgba(243,222,183,.38);padding:.5vw;text-align:left;font-size:.62vw}
.item-btn strong,.item-btn small{display:block} .item-btn small{font-size:.5vw;color:#725e46;margin-top:.12vw}
.cart-row{display:flex;justify-content:space-between;gap:.5vw;padding:.42vw 0;border-bottom:1px dotted rgba(80,50,25,.27);font-size:.62vw}
.qty{border:1px solid #89643c;background:#d7ba83;width:1.25vw;height:1.25vw;min-width:20px;min-height:20px}
/* dynamic receipt overlays the real illustrated receipt scroll */
.receipt-live {
  position:absolute;left:80.4%;top:26.1%;width:15.4%;height:48.5%;z-index:8;
  padding:2.3% 1.4% 2%;overflow:auto;color:#402918;text-align:left
}
.receipt-live .brand{text-align:center;text-transform:uppercase;letter-spacing:.12em;font-size:.5vw}
.receipt-live h3{text-align:center;font-size:1.35vw;font-weight:normal;margin:.3vw 0 .8vw}
.receipt-line{display:flex;justify-content:space-between;gap:.5vw;padding:.31vw 0;border-bottom:1px dotted rgba(75,45,20,.32);font-size:.58vw}
.receipt-section{margin-top:.5vw;padding-top:.4vw;border-top:1px dotted rgba(75,45,20,.3)}
.receipt-section>strong{display:block;font-size:.48vw;text-transform:uppercase;letter-spacing:.09em;margin-bottom:.18vw}
.role-line{display:flex;justify-content:space-between;font-size:.53vw;padding:.12vw 0}
.receipt-total{display:flex;justify-content:space-between;border-top:2px double #70502d;margin-top:.5vw;padding-top:.5vw;font-size:.72vw}
.receipt-empty{text-align:center;font-size:.62vw;font-style:italic;color:#765f47;line-height:1.45;margin-top:1vw}
.modal-bg{position:fixed;inset:0;background:rgba(18,8,3,.7);display:grid;place-items:center;z-index:100;padding:20px}
.modal{width:min(680px,95vw);max-height:88vh;overflow:auto;background:#ead0a0;border:3px solid #5b361f;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{margin-top:0;font-weight:normal} .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal .field label{font-size:10px} .modal .field input,.modal .field select,.modal .field textarea{font-size:13px;padding:7px}
.modal .ink-btn{font-size:13px;padding:5px}
@media(max-width:1100px){
 .scene{min-width:1100px}
}
</style>

<body>
<div class="scene">
  <div class="live-business">
    <label>Current Business</label>
    <select id="businessSelect"></select>
    <small id="businessLocation"></small>
  </div>
  <div class="live-coffers">
    <div><span>Company Coffers</span><strong id="companyCoffers">0</strong></div>
    <div><span>Business Coffers</span><strong id="businessCoffers">0</strong></div>
  </div>
  <nav id="nav" class="nav"></nav>
  <section class="book-live">
    <article id="leftPage" class="page left-page"></article>
    <article id="rightPage" class="page right-page"></article>
  </section>
  <aside id="receiptLive" class="receipt-live">
    <div class="brand">Golden Sands</div><h3>Receipt</h3>
    <div class="receipt-empty">The next sale will be written here.</div>
  </aside>
</div>
<div id="modalRoot"></div>

<script>
const seed={
 activeBusinessId:'caravan',company:{name:'Golden Sands Trading Company',owner:"Ko'vash",caravanCut:20},
 businesses:[
  {id:'caravan',name:'Golden Sands Caravan',type:'Caravan',hold:'The Pale',location:'Dawnstar market camp',description:'Primary travelling caravan and trade hub.',status:'Active',coffers:12450},
  {id:'farm',name:'Golden Sands Farm',type:'Farm',hold:'The Pale',location:'Outside Dawnstar',description:'Company farm supplying produce and ingredients.',status:'Active',coffers:3820},
  {id:'inn',name:'Future Golden Sands Inn',type:'Inn',hold:'Unassigned',location:'Unassigned',description:'Future hospitality business.',status:'Inactive',coffers:0}
 ],
 employees:[
  {id:1,name:"Ko'vash",email:'owner@example.com',role:'Company Owner',earnings:0,assignments:{caravan:{enabled:true,permissions:['all']},farm:{enabled:true,permissions:['all']},inn:{enabled:true,permissions:['all']}}},
  {id:2,name:"Ra'zirr",email:'razirr@example.com',role:'Merchant',earnings:3250,assignments:{caravan:{enabled:true,permissions:['register','inventory_view','orders','notebook','tasks']},farm:{enabled:false,permissions:[]},inn:{enabled:false,permissions:[]}}},
  {id:3,name:"M'aiqra",email:'maiqra@example.com',role:'Caravan Hand',earnings:1480,assignments:{caravan:{enabled:true,permissions:['inventory_view','transfers','notebook','tasks']},farm:{enabled:true,permissions:['inventory_view','inventory_edit','transfers','tasks']},inn:{enabled:false,permissions:[]}}}
 ],
 inventory:[
  {id:1,businessId:'caravan',name:'Moon Monk Robes',category:'Apparel',condition:'Exquisite',qty:4,price:1650,batches:[{batchId:'b1',qty:4,contributorId:2,source:'Stock Intake'}]},
  {id:2,businessId:'caravan',name:'Khajiit Merchant Robes',category:'Apparel',condition:'Fine',qty:7,price:900,batches:[{batchId:'b2',qty:5,contributorId:1,source:'Stock Intake'},{batchId:'b3',qty:2,contributorId:3,source:'Transfer from Farm'}]},
  {id:3,businessId:'caravan',name:'Moon Sugar',category:'Ingredient',condition:'Standard',qty:23,price:95,batches:[{batchId:'b4',qty:15,contributorId:2,source:'Stock Intake'},{batchId:'b5',qty:8,contributorId:3,source:'Stock Intake'}]},
  {id:4,businessId:'farm',name:'Potato',category:'Produce',condition:'Fresh',qty:48,price:12,batches:[{batchId:'b6',qty:48,contributorId:3,source:'Harvest / Intake'}]}
 ],
 notes:[{id:1,author:"Ra'zirr",date:'16th of Last Seed',businessId:'caravan',text:'A hunter near Whiterun claims he will have ten wolf pelts tomorrow.',pinned:true}],
 history:[],transfers:[]
};

let state=JSON.parse(localStorage.getItem("gsl-art-v1")||"null")||structuredClone(seed);
let currentView="company",cart=[];
const $=s=>document.querySelector(s);
function save(){localStorage.setItem("gsl-art-v1",JSON.stringify(state));syncHeader()}
function money(n){return Number(n||0).toLocaleString()+" septims"}
function activeBusiness(){return state.businesses.find(b=>b.id===state.activeBusinessId)||state.businesses[0]}
function inv(){return state.inventory.filter(i=>i.businessId===state.activeBusinessId)}
function empName(id){return state.employees.find(e=>e.id===id)?.name||"Unknown"}
function bizName(id){return state.businesses.find(b=>b.id===id)?.name||id}
function eligibleEmployees(bid=state.activeBusinessId){return state.employees.filter(e=>e.assignments?.[bid]?.enabled)}
function syncHeader(){
  const total=state.businesses.reduce((a,b)=>a+(Number(b.coffers)||0),0);
  $("#companyCoffers").textContent=money(total);
  $("#businessCoffers").textContent=money(activeBusiness().coffers);
  $("#businessLocation").textContent=activeBusiness().hold+" · "+activeBusiness().location;
}
function buildBusinessSelect(){
 const s=$("#businessSelect");
 s.innerHTML=state.businesses.filter(b=>b.status==="Active").map(b=>`<option value="${b.id}" ${b.id===state.activeBusinessId?"selected":""}>${b.name}</option>`).join("");
 s.onchange=()=>{state.activeBusinessId=s.value;save();render()};
}
const navItems=[
 ["company","Company Overview"],["businesses","Businesses"],["dashboard","Dashboard"],["register","Register"],
 ["inventory","Inventory"],["transfers","Transfers"],["notebook","Notebook"],["employees","Employees"],
 ["earnings","Earnings"],["coffers","Coffers"],["history","Receipts"],["permissions","Permissions"]
];
function buildNav(){
 $("#nav").innerHTML=navItems.map(([v,l])=>`<button class="${currentView===v?"active":""}" onclick="go('${v}')">${l}</button>`).join("");
}
function go(v){currentView=v;buildNav();render()}
window.go=go;
function heading(k,t){return `<span class="kicker">${k}</span><h2>${t}</h2><div class="rule"></div>`}
function accountRow(a,b){return `<div class="account-row"><span>${a}</span><strong>${b}</strong></div>`}
function render(){
 buildNav();syncHeader();
 const f=views[currentView]||views.company;f();
}
const views={};

views.company=()=>{
 const total=state.businesses.reduce((a,b)=>a+b.coffers,0);
 $("#leftPage").innerHTML=heading("Golden Sands Trading Company","Company Overview")+
   '<div class="section-title">Company Summary</div>'+
   '<div class="account-lines">'+
   accountRow("Company Coffers",money(total))+
   accountRow("Active Businesses",state.businesses.filter(b=>b.status==="Active").length)+
   accountRow("Employees",state.employees.length)+
   accountRow("Inventory Items (Stock)",state.inventory.reduce((a,b)=>a+b.qty,0))+
   '</div>'+
   '<div class="section-title">Our Businesses</div>'+
   state.businesses.map(b=>`<div class="business-entry"><button onclick="switchBusiness('${b.id}')"><strong>${b.name}</strong><small>${b.hold} · ${b.location}</small></button><div class="right">${money(b.coffers)}<br>${b.status}</div></div>`).join("");
 $("#rightPage").innerHTML=heading("Company Stock","Inventory Overview")+
   `<table class="ledger-table"><thead><tr><th>Item</th><th class="num">Stock</th><th class="num">Value</th></tr></thead><tbody>${
      state.inventory.slice(0,10).map(i=>`<tr><td>${i.name}</td><td class="num">${i.qty}</td><td class="num">${i.price}</td></tr>`).join("")
   }</tbody></table>`;
};
window.switchBusiness=id=>{state.activeBusinessId=id;save();buildBusinessSelect();go("dashboard")};

views.businesses=()=>{
 $("#leftPage").innerHTML=heading("Golden Sands Trading Company","Businesses")+
 `<div class="inline-actions"><button class="ink-btn" onclick="addBusiness()">Add New Business</button></div>`+
 state.businesses.map(b=>`<div class="business-entry"><button onclick="switchBusiness('${b.id}')"><strong>${b.name}</strong><small>${b.type} · ${b.hold} · ${b.location}</small></button><div class="right"><button class="ink-btn" onclick="editBusiness('${b.id}')">Edit</button></div></div>`).join("");
 $("#rightPage").innerHTML=heading("Company Structure","Business Notes")+
 `<div class="account-lines">${state.businesses.map(b=>accountRow(b.name,b.status)).join("")}</div>`;
};
views.dashboard=()=>{
 const b=activeBusiness(), stock=inv().reduce((a,x)=>a+x.qty,0);
 $("#leftPage").innerHTML=heading(b.name,"Business Ledger")+
 `<div class="account-lines">${accountRow("Coffers",money(b.coffers))}${accountRow("Stock Units",stock)}${accountRow("Assigned Employees",eligibleEmployees().length)}</div>
 <div class="section-title">Quick Entries</div><div class="inline-actions"><button class="ink-btn" onclick="go('register')">Open Register</button><button class="ink-btn" onclick="go('inventory')">Inventory</button><button class="ink-btn" onclick="go('transfers')">Transfer Stock</button></div>`;
 $("#rightPage").innerHTML=heading("Current Stock","Inventory")+
 `<table class="ledger-table"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Price</th></tr></thead><tbody>${inv().slice(0,12).map(i=>`<tr><td>${i.name}</td><td class="num">${i.qty}</td><td class="num">${i.price}</td></tr>`).join("")}</tbody></table>`;
};
views.inventory=()=>{
 $("#leftPage").innerHTML=heading(activeBusiness().name,"Inventory Ledger")+
 `<div class="inline-actions"><button class="ink-btn" onclick="stockIntake()">Record Stock</button><button class="ink-btn" onclick="addItem()">New Item</button></div>
 <table class="ledger-table"><thead><tr><th>Item</th><th>Condition</th><th class="num">Qty</th><th class="num">Price</th></tr></thead><tbody>${inv().map(i=>`<tr><td>${i.name}</td><td>${i.condition}</td><td class="num">${i.qty}</td><td class="num">${i.price}</td></tr>`).join("")}</tbody></table>`;
 $("#rightPage").innerHTML=heading("Stock Provenance","Contributors")+
 inv().map(i=>`<div class="business-entry"><div><strong>${i.name}</strong><small>${i.batches.map(b=>`${b.qty} by ${empName(b.contributorId)}`).join(" · ")||"No batches"}</small></div></div>`).join("");
};
views.register=()=>{
 $("#leftPage").innerHTML=heading(activeBusiness().name,"Register")+
 `<div class="item-list">${inv().filter(i=>i.qty>0).map(i=>`<button class="item-btn" onclick="addCart(${i.id})"><strong>${i.name}</strong><small>${i.qty} in stock · ${money(i.price)}</small></button>`).join("")}</div>`;
 drawRegisterRight();
};
function drawRegisterRight(){
 const es=eligibleEmployees();
 $("#rightPage").innerHTML=heading("Current Sale","Transaction")+
 (cart.length?cart.map(c=>`<div class="cart-row"><span>${c.name} × ${c.qty}</span><span><button class="qty" onclick="cartQty(${c.id},-1)">−</button> <button class="qty" onclick="cartQty(${c.id},1)">+</button></span></div>`).join(""):`<div class="receipt-empty">No items selected.</div>`)+
 `<div class="form-row" style="margin-top:.8vw"><div class="field"><label>Discount %</label><input id="discount" type="number" min="0" max="100" value="0" oninput="drawReceipt()"></div><div class="field"><label>Seller</label><select id="seller" onchange="drawReceipt()">${es.map(e=>`<option value="${e.id}">${e.name}</option>`).join("")}</select></div></div>
 <div class="field"><label>Additional Participants</label>${es.map(e=>`<label style="font-size:.58vw;margin-right:.55vw"><input class="extraPart" type="checkbox" value="${e.id}" onchange="drawReceipt()"> ${e.name}</label>`).join("")}</div>
 <div class="inline-actions"><button class="ink-btn" onclick="completeSale()">Complete Sale</button></div>`;
 drawReceipt();
}
window.addCart=id=>{const i=state.inventory.find(x=>x.id===id),c=cart.find(x=>x.id===id);if(c){if(c.qty<i.qty)c.qty++}else cart.push({id:i.id,name:i.name,price:i.price,qty:1});drawRegisterRight()};
window.cartQty=(id,d)=>{const c=cart.find(x=>x.id===id),i=state.inventory.find(x=>x.id===id);if(!c)return;c.qty=Math.max(0,Math.min(i.qty,c.qty+d));if(c.qty===0)cart=cart.filter(x=>x.id!==id);drawRegisterRight()};
function previewContributors(){
 const map=new Map();
 for(const c of cart){const item=state.inventory.find(i=>i.id===c.id);let need=c.qty;for(const b of item.batches){if(need<=0)break;const used=Math.min(need,b.qty);if(used>0){map.set(b.contributorId,(map.get(b.contributorId)||0)+used);need-=used}}}
 return [...map.entries()].map(([id,units])=>({id,name:empName(id),units}));
}
function receiptNumbers(){
 const subtotal=cart.reduce((a,b)=>a+b.price*b.qty,0);
 const d=Math.max(0,Math.min(100,Number($("#discount")?.value)||0));
 const sale=Math.round(subtotal*(1-d/100)),cut=Math.round(sale*(state.company.caravanCut/100));
 return {sale,cut,pool:sale-cut};
}
function drawReceipt(){
 const r=receiptNumbers(),contributors=previewContributors(),sellerId=Number($("#seller")?.value||0),extras=[...document.querySelectorAll(".extraPart:checked")].map(x=>Number(x.value)),participants=[...new Set([sellerId,...contributors.map(c=>c.id),...extras].filter(Boolean))],share=participants.length?Math.floor(r.pool/participants.length):0;
 $("#receiptLive").innerHTML=`<div class="brand">Golden Sands</div><h3>Receipt</h3>${cart.map(c=>`<div class="receipt-line"><span>${c.name} × ${c.qty}</span><span>${c.price*c.qty}</span></div>`).join("")}
 <div class="receipt-line"><span>Sale</span><strong>${r.sale}</strong></div><div class="receipt-line"><span>Company Cut</span><strong>${r.cut}</strong></div>
 <div class="receipt-section"><strong>Seller</strong><div class="role-line"><span>${empName(sellerId)}</span><span>Seller</span></div></div>
 <div class="receipt-section"><strong>Contributors</strong>${contributors.map(c=>`<div class="role-line"><span>${c.name}</span><span>${c.units} units</span></div>`).join("")||'<div class="role-line"><span>None</span><span>—</span></div>'}</div>
 <div class="receipt-section"><strong>Split</strong>${participants.map(id=>`<div class="role-line"><span>${empName(id)}</span><span>${share}</span></div>`).join("")}</div>
 <div class="receipt-total"><span>Total</span><strong>${r.sale}</strong></div>`;
}
function consumeBatches(item,qty){let need=qty;const used=[];for(const b of item.batches){if(need<=0)break;const take=Math.min(need,b.qty);if(take>0){used.push({contributorId:b.contributorId,qty:take,source:b.source});b.qty-=take;need-=take}}item.batches=item.batches.filter(b=>b.qty>0);item.qty-=qty;return used}
window.completeSale=()=>{if(!cart.length)return alert("Add at least one item.");const r=receiptNumbers(),sellerId=Number($("#seller").value),extras=[...document.querySelectorAll(".extraPart:checked")].map(x=>Number(x.value)),contribMap=new Map();cart.forEach(c=>{const item=state.inventory.find(i=>i.id===c.id),used=consumeBatches(item,c.qty);used.forEach(u=>contribMap.set(u.contributorId,(contribMap.get(u.contributorId)||0)+u.qty))});const contributorIds=[...contribMap.keys()],participants=[...new Set([sellerId,...contributorIds,...extras])],share=participants.length?Math.floor(r.pool/participants.length):0;participants.forEach(id=>{const e=state.employees.find(x=>x.id===id);if(e)e.earnings+=share});activeBusiness().coffers+=r.cut;state.history.unshift({id:Date.now(),businessId:state.activeBusinessId,type:"Sale",date:new Date().toLocaleString(),who:empName(sellerId),detail:cart.map(c=>`${c.name} × ${c.qty}`).join(", "),amount:r.sale,companyCut:r.cut,share,participants:participants.map(id=>({id,name:empName(id),roles:[id===sellerId?"Seller":null,contributorIds.includes(id)?"Stock Contributor":null,extras.includes(id)?"Additional":null].filter(Boolean)}))});save();cart=[];render();alert("Sale recorded.")};

views.transfers=()=>{
 $("#leftPage").innerHTML=heading(activeBusiness().name,"Transfers")+`<div class="inline-actions"><button class="ink-btn" onclick="newTransfer()">New Transfer</button></div>`+
 `<table class="ledger-table"><thead><tr><th>Item</th><th>Qty</th><th>From</th><th>To</th></tr></thead><tbody>${state.transfers.map(t=>`<tr><td>${t.item}</td><td>${t.qty}</td><td>${t.from}</td><td>${t.to}</td></tr>`).join("")}</tbody></table>`;
 $("#rightPage").innerHTML=heading("Transfer Trail","Contributor Trace")+
 state.transfers.map(t=>`<div class="business-entry"><div><strong>${t.item} × ${t.qty}</strong><small>By ${t.by}</small></div><div class="right">${(t.trace||[]).map(x=>`${empName(x.contributorId)} ${x.qty}`).join("<br>")}</div></div>`).join("");
};
views.notebook=()=>{
 $("#leftPage").innerHTML=heading(activeBusiness().name,"Caravan Notebook")+`<div class="inline-actions"><button class="ink-btn" onclick="newNote()">Write Note</button></div>`+
 state.notes.filter(n=>n.businessId===state.activeBusinessId).map(n=>`<div class="business-entry"><div><strong>${n.author}</strong><small>${n.date}</small><p style="font-size:.62vw">${n.text}</p></div></div>`).join("");
 $("#rightPage").innerHTML=heading("In Character","Caravan Notices")+`<div class="receipt-empty">Entries here are written as the characters would leave them in the shared caravan book.</div>`;
};
views.employees=()=>{
 $("#leftPage").innerHTML=heading("Golden Sands Trading Company","Employee Roster")+`<div class="inline-actions"><button class="ink-btn" onclick="addEmployee()">Add Employee</button></div>`+
 state.employees.map(e=>`<div class="business-entry"><div><strong>${e.name}</strong><small>${e.role} · ${e.email}</small></div><div class="right"><button class="ink-btn" onclick="editEmployee(${e.id})">Access</button></div></div>`).join("");
 $("#rightPage").innerHTML=heading("Business Access","Assignments")+state.employees.map(e=>`<div class="business-entry"><div><strong>${e.name}</strong><small>${state.businesses.filter(b=>e.assignments?.[b.id]?.enabled).map(b=>b.name).join(", ")||"No business access"}</small></div></div>`).join("");
};
views.earnings=()=>{
 $("#leftPage").innerHTML=heading("Golden Sands Trading Company","Employee Earnings")+`<div class="account-lines">${state.employees.map(e=>accountRow(e.name,money(e.earnings))).join("")}</div>`;
 $("#rightPage").innerHTML=heading("Profit Distribution","Company Cut")+`<div class="account-lines">${accountRow("Default Company Cut",state.company.caravanCut+"%")}</div>`;
};
views.coffers=()=>{
 $("#leftPage").innerHTML=heading(activeBusiness().name,"Coffers Ledger")+`<div class="account-lines">${accountRow("Business Balance",money(activeBusiness().coffers))}${accountRow("Company Total",money(state.businesses.reduce((a,b)=>a+b.coffers,0)))}${accountRow("Company Cut",state.company.caravanCut+"%")}</div>`;
 $("#rightPage").innerHTML=heading("Accounts","Business Coffers")+state.businesses.map(b=>accountRow(b.name,money(b.coffers))).join("");
};
views.history=()=>{
 const hs=state.history.filter(h=>h.businessId===state.activeBusinessId);
 $("#leftPage").innerHTML=heading(activeBusiness().name,"Receipt Book")+`<table class="ledger-table"><thead><tr><th>Date</th><th>Seller</th><th>Goods</th><th class="num">Sale</th></tr></thead><tbody>${hs.map(h=>`<tr><td>${h.date}</td><td>${h.who}</td><td>${h.detail}</td><td class="num">${h.amount}</td></tr>`).join("")}</tbody></table>`;
 $("#rightPage").innerHTML=heading("Participants","Sale Shares")+hs.map(h=>`<div class="business-entry"><div><strong>${h.detail}</strong><small>${h.participants?.map(p=>p.name+" ("+p.roles.join("/")+")").join(", ")||"—"}</small></div></div>`).join("");
};
views.permissions=()=>{
 $("#leftPage").innerHTML=heading("Administration","Permissions")+`<div class="receipt-empty">Employee access is stored per business. Use the Employees page to edit access.</div>`;
 $("#rightPage").innerHTML=heading("Google Login","Future Backend")+`<div class="receipt-empty">Google account authentication becomes active when the Cloudflare backend is connected.</div>`;
};

/* modals */
function modal(title,body,onSave){$("#modalRoot").innerHTML=`<div class="modal-bg"><div class="modal"><h3>${title}</h3>${body}<div class="modal-actions"><button class="ink-btn" onclick="closeModal()">Cancel</button><button id="modalSave" class="ink-btn">Save</button></div></div></div>`;$("#modalSave").onclick=onSave}
window.closeModal=()=>$("#modalRoot").innerHTML="";
window.addBusiness=()=>modal("Add Business",`<div class="field"><label>Name</label><input id="bName"></div><div class="form-row"><div class="field"><label>Type</label><input id="bType" value="Shop"></div><div class="field"><label>Hold</label><input id="bHold"></div></div><div class="field"><label>Location</label><input id="bLoc"></div>`,()=>{const n=$("#bName").value.trim();if(!n)return;const id="biz"+Date.now();state.businesses.push({id,name:n,type:$("#bType").value||"Shop",hold:$("#bHold").value||"Unassigned",location:$("#bLoc").value||"Unassigned",description:"",status:"Active",coffers:0});state.employees.forEach(e=>e.assignments[id]={enabled:false,permissions:[]});save();closeModal();buildBusinessSelect();render()});
window.editBusiness=id=>{const b=state.businesses.find(x=>x.id===id);modal("Edit Business",`<div class="field"><label>Name</label><input id="bName" value="${b.name}"></div><div class="form-row"><div class="field"><label>Type</label><input id="bType" value="${b.type}"></div><div class="field"><label>Hold</label><input id="bHold" value="${b.hold}"></div></div><div class="field"><label>Location</label><input id="bLoc" value="${b.location}"></div>`,()=>{b.name=$("#bName").value;b.type=$("#bType").value;b.hold=$("#bHold").value;b.location=$("#bLoc").value;save();closeModal();buildBusinessSelect();render()})};
window.addItem=()=>modal("New Item",`<div class="field"><label>Name</label><input id="iName"></div><div class="form-row"><div class="field"><label>Category</label><input id="iCat"></div><div class="field"><label>Condition</label><input id="iCond" value="Standard"></div></div><div class="field"><label>Price</label><input id="iPrice" type="number"></div>`,()=>{if(!$("#iName").value.trim())return;state.inventory.push({id:Date.now(),businessId:state.activeBusinessId,name:$("#iName").value.trim(),category:$("#iCat").value||"Misc",condition:$("#iCond").value||"Standard",qty:0,price:Number($("#iPrice").value)||0,batches:[]});save();closeModal();render()});
window.stockIntake=()=>modal("Stock Intake",`<div class="field"><label>Item</label><select id="siItem">${inv().map(i=>`<option value="${i.id}">${i.name}</option>`).join("")}</select></div><div class="form-row"><div class="field"><label>Quantity</label><input id="siQty" type="number" value="1"></div><div class="field"><label>Employee</label><select id="siEmp">${eligibleEmployees().map(e=>`<option value="${e.id}">${e.name}</option>`).join("")}</select></div></div>`,()=>{const i=state.inventory.find(x=>x.id===Number($("#siItem").value)),q=Math.max(1,Number($("#siQty").value)||1),eid=Number($("#siEmp").value);i.qty+=q;i.batches.push({batchId:"b"+Date.now(),qty:q,contributorId:eid,source:"Stock Intake"});save();closeModal();render()});
window.addEmployee=()=>modal("Add Employee",`<div class="field"><label>Name</label><input id="eName"></div><div class="field"><label>Google Email</label><input id="eEmail"></div><div class="field"><label>Role</label><input id="eRole" value="Merchant"></div>`,()=>{if(!$("#eName").value.trim())return;const assignments={};state.businesses.forEach(b=>assignments[b.id]={enabled:false,permissions:[]});state.employees.push({id:Date.now(),name:$("#eName").value.trim(),email:$("#eEmail").value.trim(),role:$("#eRole").value||"Merchant",earnings:0,assignments});save();closeModal();render()});
window.editEmployee=id=>{const e=state.employees.find(x=>x.id===id);modal("Business Access",state.businesses.map(b=>`<label style="display:block;margin:8px 0;font-size:13px"><input class="bizA" data-biz="${b.id}" type="checkbox" ${e.assignments?.[b.id]?.enabled?"checked":""}> ${b.name}</label>`).join(""),()=>{state.businesses.forEach(b=>{e.assignments[b.id]=e.assignments[b.id]||{permissions:[]};e.assignments[b.id].enabled=document.querySelector(`.bizA[data-biz="${b.id}"]`).checked});save();closeModal();render()})};
window.newTransfer=()=>modal("Transfer Stock",`<div class="field"><label>Item</label><select id="trItem">${inv().map(i=>`<option value="${i.id}">${i.name} (${i.qty})</option>`).join("")}</select></div><div class="form-row"><div class="field"><label>Qty</label><input id="trQty" type="number" value="1"></div><div class="field"><label>Destination</label><select id="trDest">${state.businesses.filter(b=>b.id!==state.activeBusinessId&&b.status==="Active").map(b=>`<option value="${b.id}">${b.name}</option>`).join("")}</select></div></div><div class="field"><label>Employee</label><select id="trEmp">${eligibleEmployees().map(e=>`<option value="${e.id}">${e.name}</option>`).join("")}</select></div>`,()=>{const src=state.inventory.find(i=>i.id===Number($("#trItem").value)),qty=Math.max(1,Number($("#trQty").value)||1),dest=$("#trDest").value,eid=Number($("#trEmp").value);if(qty>src.qty)return alert("Not enough stock.");let need=qty,trace=[];for(const b of src.batches){if(need<=0)break;const take=Math.min(need,b.qty);if(take){trace.push({contributorId:b.contributorId,qty:take,source:b.source});b.qty-=take;need-=take}}src.batches=src.batches.filter(b=>b.qty>0);src.qty-=qty;let target=state.inventory.find(i=>i.businessId===dest&&i.name===src.name&&i.condition===src.condition);if(!target){target={...src,id:Date.now(),businessId:dest,qty:0,batches:[]};state.inventory.push(target)}target.qty+=qty;trace.forEach(t=>target.batches.push({batchId:"b"+Date.now()+Math.random(),qty:t.qty,contributorId:t.contributorId,source:"Transfer by "+empName(eid)}));state.transfers.unshift({id:Date.now(),date:new Date().toLocaleString(),item:src.name,qty,from:activeBusiness().name,to:bizName(dest),by:empName(eid),trace});save();closeModal();render()});
window.newNote=()=>modal("Write Note",`<div class="field"><label>Notice</label><textarea id="nText"></textarea></div>`,()=>{if(!$("#nText").value.trim())return;state.notes.unshift({id:Date.now(),author:"Ko'vash",date:new Date().toLocaleString(),businessId:state.activeBusinessId,text:$("#nText").value.trim(),pinned:false});save();closeModal();render()});

buildBusinessSelect();buildNav();syncHeader();render();
</script>
</body>
</html>
